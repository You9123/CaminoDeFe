<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e6"/>
      <stop offset="1" stop-color="#f1e3cb"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9a4a20"/>
      <stop offset="1" stop-color="#d08a4f"/>
    </linearGradient>
    <clipPath id="c"><rect x="32" y="32" width="960" height="960" rx="220"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="560" cy="360" r="170" fill="#f3d8b8"/>
    <!-- colina lejana con la cruz -->
    <path d="M-20 560 C 200 470, 420 440, 560 452 C 720 466, 860 520, 1044 600 L 1044 1044 L -20 1044 Z" fill="#e9d4b2"/>
    <!-- colina cercana -->
    <path d="M-20 720 C 220 640, 420 660, 560 700 C 720 746, 880 700, 1044 650 L 1044 1044 L -20 1044 Z" fill="#dfc39a"/>
    <!-- camino en perspectiva -->
    <path d="M250 1044 C 360 900, 560 820, 520 720 C 490 640, 520 520, 552 470 L 568 470 C 578 520, 580 620, 640 700 C 720 800, 700 920, 800 1044 Z" fill="url(#road)"/>
    <!-- cruz -->
    <path d="M560 200 V 456 M 482 272 H 638" stroke="#2b2119" stroke-width="44" stroke-linecap="round"/>
  </g>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="none" stroke="#dcc6a4" stroke-width="8"/>
</svg>
